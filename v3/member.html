<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paytm Circle: member view</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--navy:#004299;--bg:#F5F5F5;--ink:#282828;--ink2:#555;--ink3:#8A8A8A;--line:#EBEBEB;--radio:#CBCBCB;--link:#2074CA;--chk:#1577DC;--cyan:#00B8F6;--sky:#E1F5FE;--green:#15883A;--red:#D9343F;--logo:#072966;--orange:#F19F18;--band:#F2F6FA}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#DDE4EE;color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit;border:0;outline:0;background:none;min-width:0}
#stage{display:flex;gap:36px;align-items:center}
#phone{width:360px;height:785px;background:#fff;border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 9px #16181d,0 24px 60px rgba(0,0,0,.35);transform-origin:center}
#sbar{height:37px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 26px;font-size:13.5px;font-weight:600;background:#fff;transition:background .2s}
#sbar .r{display:flex;gap:6px;align-items:center}
#app{flex:1;position:relative;overflow:hidden;background:#fff}
#nbar{height:45px;flex:none;display:flex;justify-content:space-between;align-items:center;background:#fff;color:#8a8a8a;padding:0 76px}
#nbar button{display:grid;place-items:center;width:40px;height:40px}
#demo{width:250px;font-size:13px;color:#33415c;line-height:1.45}
#demo h3{font-size:15px;margin-bottom:6px;color:#0b1b3a}
#demo p{margin-bottom:12px}
#demo button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #c9d3e3;border-radius:10px;padding:9px 12px;margin-bottom:8px;font-weight:600;color:#0b2a6b}
#demo button:hover{border-color:var(--navy)}
@media (max-width:640px){
  body{background:#fff;display:block}
  #stage{display:block}
  #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
  #sbar,#nbar,#demo{display:none}
}
/* generic */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr.w{background:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.hdr{height:56px;flex:none;display:flex;align-items:center;padding:0 4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.sp{flex:1}
.h1{font-size:30.5px;font-weight:700;line-height:37px;letter-spacing:-.2px;padding:0 12px}
.card{background:#fff;border-radius:20px;margin:0 12px}
.btn{height:52px;border-radius:26px;background:var(--navy);color:#fff;font-weight:700;font-size:15.5px;width:100%;text-align:center;letter-spacing:-.1px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.foot{flex:none;background:#fff;padding:16px 12px 20px;border-top:1px solid var(--line)}
.foot.nb{border-top:0}
.lnk{color:var(--link);font-weight:600}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;position:relative;letter-spacing:-.2px}
.av.s{width:34px;height:34px;font-size:12.5px}
.av.m{width:40px;height:40px;font-size:14px}
.rad{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--radio);flex:none;display:grid;place-items:center}
.rad.on{border:0;background:var(--chk)}
.rad.lg{width:24px;height:24px;border:2px solid #757575}
.rad.lg.on{border:0}
.cb{width:22px;height:22px;border:2px solid var(--chk);border-radius:3px;flex:none;display:grid;place-items:center}
.cb.off{border-color:#9AA4B2}
.list .row{display:flex;align-items:center;padding-left:16px}
.list .row .av{margin-right:12px}
.list .tx{flex:1;display:flex;align-items:center;min-height:72px;border-bottom:1px solid var(--line);padding-right:18px;gap:10px}
.list .row:last-child .tx{border-bottom:0}
.list .nm{flex:1;min-width:0}
.list .n1{font-size:14.5px;line-height:20px}
.list .n2{font-size:12px;color:#505050;margin-top:3px}
.list .n1.big{font-size:16px}
/* toast + sheet */
#toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:#1f2633;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:300px;text-align:center;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:40;animation:fd .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:41;max-height:88%;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet .sh-h{display:flex;align-items:center;padding:20px 16px 8px}
.sheet .sh-t{flex:1;font-size:19.5px;font-weight:700}
.sheet .sh-b{overflow-y:auto;flex:1}
.sheet .sh-f{padding:14px 16px 20px}
.xbtn{width:24px;height:24px;border-radius:50%;background:#6F6F6F;display:grid;place-items:center}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
/* paytm logo */
.logo{font-family:Inter,sans-serif;font-weight:900;font-size:31px;letter-spacing:-1.4px;color:var(--logo);line-height:1;font-style:normal;transform:scaleY(1.08)}
.logo span{color:var(--cyan)}
/* ---------- HOME ---------- */
.h-top{display:flex;align-items:center;padding:12px 8px 0 12px;gap:8px}
.av-as{width:44px;height:44px;border-radius:50%;background:#F0D5F6;color:#9A3FB1;display:grid;place-items:center;font-size:16px;font-weight:500}
.gold{font-size:12.5px;font-weight:600;line-height:16px;margin-left:12px}
.gold b{font-weight:800}
.gold-go{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#1A73E8;vertical-align:-2px;margin-left:2px}
.banner{position:relative;height:150px;padding:30px 0 0 38px}
.bn-t{font-size:15px;line-height:18px;font-weight:500;width:178px}
.bn-b{margin-top:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;height:25px;border-radius:13px;padding:0 12px}
.bn-art{position:absolute;right:46px;top:16px}
.dots{position:absolute;left:170px;bottom:10px;display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#e2e2e2}.dots i.on{background:#333}
.tnc{position:absolute;right:18px;bottom:8px;font-size:7px;color:#666}
.home h2{font-size:20px;font-weight:700}
.upi{padding:20px 16px 18px;margin-top:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px}
.u{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:15px;text-align:center;color:#333}
.uc{width:48px;height:48px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.rb{margin-top:17px;padding:20px 0 14px}
.rb-h{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.va{display:flex;align-items:center;gap:6px;color:var(--link);font-size:15px;font-weight:500}
.tiles{display:flex;overflow-x:auto;scrollbar-width:none;padding:22px 0 0 6px;scroll-snap-type:x proximity}
.tiles::-webkit-scrollbar{display:none}
.t{flex:none;width:88px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:12px;line-height:15px;color:#3a3a3a;text-align:center;position:relative;scroll-snap-align:start}
.ti{width:46px;height:46px;display:grid;place-items:center;border-radius:14px}
.t-circle .ti{background:var(--sky);box-shadow:inset 0 0 0 1px #BFE8FB}
.t-circle .tl{color:var(--navy);font-weight:600}
.t em{position:absolute;top:37px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:600;color:#111;background:#FFD766;border:1px solid #F5BE1E;border-radius:7px;padding:0 8px;line-height:13px;white-space:nowrap}
.ind{height:5px;width:27px;border-radius:3px;background:#E7E7E7;margin:20px auto 0;position:relative;overflow:hidden}
.ind i{position:absolute;top:0;bottom:0;left:0;width:55%;border-radius:3px;background:#6E6E6E}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:19px 12px 0}
.g2 .c{background:#fff;border-radius:20px;padding:16px}
.g2 .tall{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;min-height:130px}
.g2 .small{display:flex;align-items:center;gap:12px;font-size:16px;min-height:62px}
.g2 .pp1{font-size:16px}.g2 .pp2{font-size:13px;color:#777;margin-top:3px;line-height:15px}
.scanqr{position:absolute;left:50%;transform:translateX(-50%);bottom:15px;width:162px;height:56px;border-radius:28px;background:linear-gradient(180deg,#1F5FC7,#062F78);color:#fff;font-size:19px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 0 1.5px #5D8FE0 inset,0 6px 16px rgba(0,40,110,.3)}
/* ---------- PAY ANYONE ---------- */
.pa-help{display:flex;align-items:center;gap:6px;font-size:15px;color:#333}
.pa-t{font-size:33px;font-weight:700;letter-spacing:-.4px;padding:4px 12px 0;line-height:40px}
.pa-s{display:flex;align-items:center;gap:10px;font-size:14px;color:#333;padding:6px 12px 0}
.pa-sr{display:flex;align-items:center;gap:12px;padding:24px 12px 0}
.pa-in{flex:1;height:55px;border-radius:28px;border:1.5px solid #C5D3E8;display:flex;align-items:center;padding:0 16px;font-size:15.5px;color:#7A7A7A;white-space:nowrap;overflow:hidden}
.pa-ct{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:#333;width:60px}
.pa-h{font-size:20px;font-weight:700;padding:30px 12px 0;display:flex;justify-content:space-between;align-items:center}
.pa-g{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px;padding:16px 4px 18px}
.pa-p{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:16px;text-align:center;color:#222}
.av.xl{width:64px;height:64px;font-size:19px}
.pa-chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:16px 12px 0}
.pa-chips::-webkit-scrollbar{display:none}
.pa-c{flex:none;height:36px;border-radius:18px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:#222;white-space:nowrap}
.pa-ft{flex:none;height:30px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;color:#777;background:var(--bg)}
/* ---------- AI SUGGESTION ---------- */
.ai{background:linear-gradient(135deg,#EAF6FF 0%,#F3F0FF 100%);border:1px solid #CFE3FA;border-radius:16px;padding:12px 14px 12px;margin-top:18px;position:relative}
.ai-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#004299;letter-spacing:.3px;text-transform:uppercase}
.ai p{font-size:13.5px;line-height:19px;margin-top:6px;color:#222}
.ai p b{font-weight:700}
.ai .ab{margin-top:10px;height:34px;border-radius:17px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.ai small{display:block;font-size:10.5px;color:#6b7280;margin-top:8px}
.ai .ax{position:absolute;top:8px;right:8px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.ai-r{display:flex;align-items:center;gap:8px;font-size:15px;padding-right:26px}
.ai-r2{display:flex;align-items:center;gap:10px;margin-top:10px}
.ai-r2 .ab{margin-top:0}
.offp{display:inline-block;background:#FFD766;border:1px solid #F5BE1E;color:#111;font-size:11px;font-weight:600;border-radius:8px;padding:1px 8px;white-space:nowrap}
.pl{font-size:12px;font-weight:600;margin-top:3px}.pl.ok{color:#15883A}.pl.due{color:#D9343F}
/* ---------- PAYMENT SUCCESS ---------- */
.sc-card{margin:8px 16px 0;border-radius:16px;overflow:hidden;background:var(--sky)}
.sc-in{padding:26px 16px 32px}
.sc-t{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.sc-d{font-size:14px;margin-top:6px}
.sc-d a{color:var(--cyan);font-weight:500}
.sc-op{display:flex;gap:12px;margin-top:24px;font-size:14px;line-height:20px}
.jio{width:40px;height:40px;border-radius:50%;background:#0F3CC9;color:#fff;font-weight:800;font-style:italic;display:grid;place-items:center;font-size:15px;letter-spacing:-.5px;flex:none}
.dash{border-top:2px dashed #8E8E8E;margin:24px 0 18px;opacity:.7}
.note{font-size:14px;line-height:26px}
.note b{color:var(--orange);font-weight:600}
.sc-btns{display:flex;gap:9px;margin:24px -16px 0 0;overflow-x:auto;scrollbar-width:none;padding-right:16px}
.sc-btns::-webkit-scrollbar{display:none}
.pb{flex:none;height:38px;border-radius:19px;padding:0 17px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pb.f{background:var(--cyan);color:#fff}
.pb.o{border:1.5px solid var(--cyan);color:var(--cyan);background:transparent}
.scratch{height:54px;background:linear-gradient(90deg,#2B176F,#5B2BC9 55%,#A464F7);border-top:7px solid var(--cyan);box-shadow:inset 0 7px 0 #0B2A73;display:flex;align-items:center;padding-left:84px;color:#fff;font-weight:800;font-size:12px;letter-spacing:2px;white-space:nowrap;overflow:hidden;position:relative}
.scratch .sw{position:absolute;left:12px;bottom:-4px;width:56px;height:68px;border-radius:9px;background:linear-gradient(160deg,#F25FB3,#7B2FD8);transform:rotate(-12deg);display:grid;place-items:center;font-size:11px;letter-spacing:0;font-style:italic;box-shadow:0 0 0 2px #fff}
.goldb{margin:24px 12px 0;height:48px;border-radius:24px;background:linear-gradient(90deg,#FFF3D6,#FFFBF1);display:flex;align-items:center;padding:0 10px 0 14px;gap:10px}
.goldb .coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#E2A821);flex:none}
.goldb .gt{flex:1;color:#E59A1E;font-weight:700;font-size:12.5px;line-height:15px}
.goldb .gp{background:#0A2A7A;color:#fff;border-radius:14px;height:24px;padding:0 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.rdone{margin:32px 12px 0;border-radius:24px;background:linear-gradient(120deg,#E6F4FF,#F7FBFF);padding:22px 18px;min-height:110px}
.rdone .g{color:#1E8E4A;font-weight:600;font-size:13.5px}
.rdone .b{font-size:14px;margin-top:6px}
.bnav{position:absolute;left:29px;right:29px;bottom:29px;height:63px;border-radius:32px;background:#002A90;display:flex;justify-content:space-around;align-items:center;color:#fff}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px}
/* ---------- ONBOARD ---------- */
.ob-h{height:68px;position:relative;justify-content:space-between}
.ob-mid{text-align:center;line-height:1}
.ob-sub{font-size:17px;font-weight:800;color:#0A3A8C;letter-spacing:-.4px;margin-top:4px}
.prog{display:flex;gap:4px;padding:2px 16px 0}
.prog i{flex:1;height:3px;border-radius:2px;background:#EBEBEB;position:relative;overflow:hidden}
.prog i b{position:absolute;inset:0;width:0;background:var(--navy);border-radius:2px}
.prog i.done b{width:100%}
.prog i.cur b{animation:fill 3.6s linear forwards}
@keyframes fill{to{width:100%}}
.ob-art{margin-top:35px;height:320px;background-color:#fff;background-image:repeating-linear-gradient(90deg,rgba(0,140,255,.07) 0 22px,transparent 22px 44px),repeating-linear-gradient(0deg,rgba(0,140,255,.07) 0 22px,transparent 22px 44px);display:grid;place-items:center}
.ob-t{font-size:29.5px;font-weight:700;text-align:center;line-height:40px;letter-spacing:-.2px;padding:0 40px;margin-top:62px}
/* ---------- SELECT ---------- */
.srch{margin:20px 12px 0;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.srch input{flex:1;font-size:15.5px}
.srch input::placeholder{color:#737373}
.srch.ol{margin:0;flex:1;border:1.5px solid #0D3F8F;margin-right:12px;padding:0 10px;gap:8px}.srch.ol input{font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;padding:12px 0 10px}
.chip{width:88px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;line-height:16px;text-align:center;padding-bottom:6px}
.chip .x{position:absolute;top:-2px;right:-6px;width:14px;height:14px;border-radius:50%;background:#757575;display:grid;place-items:center;box-shadow:0 0 0 1.5px #fff}
.addm .av{background:#F4F6F8;border:1.5px dashed #C9CACC}
/* ---------- DETAILS ---------- */
.dcard{margin:20px 12px 0;padding:16px;display:flex;align-items:center;gap:17px}
.cic{width:48px;height:48px;border-radius:50%;background:#FFE8E8;display:grid;place-items:center;flex:none}
.fld{flex:1;position:relative;border:1.5px solid #0D3F8F;border-radius:12px;height:48px;display:flex;align-items:center;padding:0 12px}
.fld label{position:absolute;top:-10px;left:10px;background:#fff;padding:0 4px;font-size:14px;color:#555}
.fld input{font-size:15.5px;width:100%}
.sec{font-size:17.5px;font-weight:700;padding:36px 28px 14px}
/* ---------- CIRCLE ---------- */
.c-head{flex:none;background:linear-gradient(150deg,#FFF3EA 0%,#FCE1D2 45%,#FFF0DA 100%);padding-bottom:16px}
.c-top{display:flex;align-items:center;height:56px;padding:0 8px 0 4px;gap:16px}
.c-top .ac{display:flex;align-items:center;gap:7px;font-size:15px;color:#333}
.c-title{font-size:30.5px;font-weight:700;letter-spacing:-.3px;line-height:36px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal{margin:15px 8px 0;background:#fff;border-radius:24px;border:1px solid #D6E0EE;display:flex;padding:16px 16px 14px;box-shadow:0 2px 6px rgba(0,30,80,.06)}
.bal>div{flex:1}
.bal .l{font-size:13px;color:#3d3d3d}
.bal .v{font-size:23px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:9px;letter-spacing:-.5px}
.bal .r{text-align:right;border-left:1px solid #DCE3EC;margin:4px 0}
.bal .r .v{justify-content:flex-end}
.bdg{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.tabs{display:flex;gap:8px;padding:14px 12px 4px;flex:none;background:var(--bg)}
.tab{height:36px;border-radius:18px;padding:0 20px;border:1.5px solid #E3E3E3;background:#fff;font-size:14.5px;display:flex;align-items:center;gap:8px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.tab .cnt{font-size:12px;background:#E9EEF5;color:#333;border-radius:9px;padding:1px 7px;font-weight:600}
.tab.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.mcard{margin:12px 12px 0;background:#fff;border-radius:20px;overflow:hidden}
.mhd{background:var(--band);padding:16px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mhd small{font-size:12.5px;font-weight:500;color:#666}
.brow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%}
.brow:last-child{border-bottom:0}
.bic{width:42px;height:42px;border-radius:50%;background:var(--sky);display:grid;place-items:center;flex:none}
.bt{flex:1;min-width:0}
.bt1{font-size:14.5px}
.bt2{font-size:12.5px;color:#666;margin-top:3px;line-height:16px}
.bamt{text-align:right;font-size:14.5px;font-weight:600}
.paid{color:var(--green);font-size:12px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:3px;justify-content:flex-end}
.pay{margin-top:5px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;height:26px;border-radius:13px;padding:0 14px}
.h2s{font-size:21px;font-weight:700;padding:26px 16px 0}
